<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Courses - Student Management System
    </title>

    <link rel="stylesheet"
        href="../css/style.css">

    <link rel="stylesheet"
        href="../css/dashboard.css">

    <link rel="stylesheet"
        href="../css/forms.css">

</head>


<body>


    <!-- ==============================
         SIDEBAR
    =============================== -->

    <aside class="sidebar">

        <div class="logo">
            Student MS
        </div>


        <nav>

            <a href="../index.html">
                Dashboard
            </a>

            <a href="students.html">
                Students
            </a>

            <a href="courses.html"
               class="active">
                Courses
            </a>

            <a href="departments.html">
                Departments
            </a>

            <a href="attendance.html">
                Attendance
            </a>

        </nav>

    </aside>



    <!-- ==============================
         MAIN CONTENT
    =============================== -->

    <main class="main-content">


        <!-- PAGE HEADER -->

        <header class="topbar">

            <div>

                <h1>
                    Courses
                </h1>

                <p>
                    Manage all courses from here.
                </p>

            </div>

        </header>



        <!-- ==============================
             ADD COURSE FORM
        =============================== -->

        <section class="form-container">


            <div class="form-header">

                <h2>
                    Add New Course
                </h2>

                <p>
                    Enter course information below.
                </p>

            </div>



            <form id="courseForm">


                <!-- COURSE NAME + CODE -->

                <div class="form-row">


                    <div class="form-group">

                        <label for="courseName">

                            Course Name

                            <span class="required">
                                *
                            </span>

                        </label>


                        <input
                            type="text"
                            id="courseName"
                            placeholder="e.g. Database Management System"
                            required
                        >

                    </div>



                    <div class="form-group">

                        <label for="courseCode">

                            Course Code

                            <span class="required">
                                *
                            </span>

                        </label>


                        <input
                            type="text"
                            id="courseCode"
                            placeholder="e.g. CS-301"
                            required
                        >

                    </div>


                </div>



                <!-- CREDIT HOURS + DEPARTMENT -->

                <div class="form-row">


                    <div class="form-group">

                        <label for="creditHours">

                            Credit Hours

                            <span class="required">
                                *
                            </span>

                        </label>


                        <input
                            type="number"
                            id="creditHours"
                            placeholder="e.g. 3"
                            min="1"
                            max="6"
                            required
                        >

                    </div>



                    <div class="form-group">

                        <label for="department">

                            Department

                            <span class="required">
                                *
                            </span>

                        </label>


                        <select
                            id="department"
                            required
                        >

                            <option value="">
                                Select Department
                            </option>

                        </select>

                    </div>


                </div>



                <!-- BUTTONS -->

                <div class="form-actions">


                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        Add Course
                    </button>


                    <button
                        type="reset"
                        class="btn btn-secondary"
                    >
                        Clear
                    </button>


                </div>


            </form>

        </section>



        <!-- ==============================
             ALL COURSES
        =============================== -->

        <section class="form-container">


            <div class="form-header">

                <h2>
                    All Courses
                </h2>

                <p>
                    View, edit and delete courses.
                </p>

            </div>



            <!-- COURSE TABLE -->

            <div class="table-container">


                <table>


                    <thead>

                        <tr>

                            <th>
                                Course Name
                            </th>

                            <th>
                                Course Code
                            </th>

                            <th>
                                Credit Hours
                            </th>

                            <th>
                                Department
                            </th>

                            <th>
                                Actions
                            </th>

                        </tr>

                    </thead>



                    <tbody id="courseTable">

                        <!--
                            Courses will be loaded
                            here by courses.js
                        -->

                    </tbody>


                </table>


            </div>


        </section>


    </main>



    <!-- ==============================
         JAVASCRIPT
    =============================== -->

    <script src="../js/api.js"></script>

    <script src="../js/courses.js"></script>


</body>

</html>
