<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Students - Student Management System</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/forms.css">

</head>


<body>


    <!-- =========================
         SIDEBAR
    ========================== -->

    <aside class="sidebar">

        <div class="logo">
            Student MS
        </div>

        <nav>

            <a href="../index.html">
                Dashboard
            </a>

            <a
                href="students.html"
                class="active"
            >
                Students
            </a>

            <a href="courses.html">
                Courses
            </a>

            <a href="departments.html">
                Departments
            </a>

            <a href="attendance.html">
                Attendance
            </a>

        </nav>

    </aside>



    <!-- =========================
         MAIN CONTENT
    ========================== -->

    <main class="main-content">


        <!-- PAGE HEADER -->

        <header class="topbar">

            <div>

                <h1>
                    Students
                </h1>

                <p>
                    Manage all students from here.
                </p>

            </div>

        </header>



        <!-- =========================
             ADD STUDENT FORM
        ========================== -->

        <section class="form-container">


            <div class="form-header">

                <h2>
                    Add New Student
                </h2>

                <p>
                    Enter student information below.
                </p>

            </div>



            <form id="studentForm">


                <!-- NAME + EMAIL -->

                <div class="form-row">


                    <div class="form-group">

                        <label for="name">

                            Student Name

                            <span class="required">
                                *
                            </span>

                        </label>


                        <input
                            type="text"
                            id="name"
                            placeholder="Enter student name"
                            required
                        >

                    </div>



                    <div class="form-group">

                        <label for="email">

                            Email

                            <span class="required">
                                *
                            </span>

                        </label>


                        <input
                            type="email"
                            id="email"
                            placeholder="Enter student email"
                            required
                        >

                    </div>


                </div>



                <!-- ROLL NUMBER + SEMESTER -->

                <div class="form-row">


                    <div class="form-group">

                        <label for="rollNumber">

                            Roll Number

                            <span class="required">
                                *
                            </span>

                        </label>


                        <input
                            type="text"
                            id="rollNumber"
                            placeholder="e.g. BSCS-001"
                            required
                        >

                    </div>



                    <div class="form-group">

                        <label for="semester">

                            Semester

                            <span class="required">
                                *
                            </span>

                        </label>


                        <select
                            id="semester"
                            required
                        >

                            <option value="">
                                Select Semester
                            </option>

                            <option value="1">
                                Semester 1
                            </option>

                            <option value="2">
                                Semester 2
                            </option>

                            <option value="3">
                                Semester 3
                            </option>

                            <option value="4">
                                Semester 4
                            </option>

                            <option value="5">
                                Semester 5
                            </option>

                            <option value="6">
                                Semester 6
                            </option>

                            <option value="7">
                                Semester 7
                            </option>

                            <option value="8">
                                Semester 8
                            </option>

                        </select>

                    </div>


                </div>



                <!-- DEPARTMENT -->

                <div class="form-group">

                    <label for="department">

                        Department

                        <span class="required">
                            *
                        </span>

                    </label>


                    <select
                        id="department"
                        required
                    >

                        <option value="">
                            Select Department
                        </option>

                    </select>

                </div>



                <!-- BUTTONS -->

                <div class="form-actions">


                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        Add Student
                    </button>


                    <button
                        type="reset"
                        class="btn btn-secondary"
                    >
                        Clear
                    </button>


                </div>


            </form>


        </section>



        <!-- =========================
             STUDENTS TABLE
        ========================== -->

        <section class="table-container">


            <div class="form-header">

                <h2>
                    All Students
                </h2>

                <p>
                    View, edit and delete students.
                </p>

            </div>



            <div class="table-wrapper">


                <table>


                    <thead>

                        <tr>

                            <th>
                                Name
                            </th>

                            <th>
                                Email
                            </th>

                            <th>
                                Roll Number
                            </th>

                            <th>
                                Semester
                            </th>

                            <th>
                                Department
                            </th>

                            <th>
                                Actions
                            </th>

                        </tr>

                    </thead>



                    <tbody id="studentsTableBody">

                        <!-- Students will be loaded here -->

                    </tbody>


                </table>


            </div>


        </section>


    </main>



    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script src="../js/api.js"></script>

    <script src="../js/students.js"></script>


</body>

</html>
